[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enchufe"
version = "1.0.0"
description = "Control de enchufes WiFi Zengge/MagicHome (LEDENET) desde la terminal: local sin nube, o por la nube cuando no estas en casa"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Leonardo Aguayo" }]
keywords = [
    "smart-plug", "enchufe", "wifi", "zengge", "magichome", "magichue",
    "ledenet", "flux-led", "domotica", "home-automation", "cli", "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "flux_led",   # control local por TCP 5577 (protocolo LEDENET)
    "magichue",   # control por la nube de MagicHue/Briturn
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repositorio = "https://github.com/leostriker111/Enchufe"
Incidencias = "https://github.com/leostriker111/Enchufe/issues"

[project.scripts]
enchufe = "enchufe:main"

[tool.setuptools]
py-modules = ["enchufe"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["test_*.py"]
